<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>옵시디언 열기</title>
<style>
:root{--bg:#fafafa;--fg:#222;--muted:#666;--btn:#7c3aed;--btnfg:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#1b1b1d;--fg:#eee;--muted:#aaa;--btn:#8b5cf6}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Malgun Gothic",sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
main{max-width:420px;text-align:center}
a.btn{display:inline-block;margin-top:16px;padding:14px 22px;border-radius:10px;background:var(--btn);color:var(--btnfg);text-decoration:none;font-size:17px}
p{color:var(--muted);font-size:14px;line-height:1.6;word-break:break-all}
</style>
</head>
<body>
<main>
<h2 id="t">옵시디언으로 여는 중…</h2>
<p id="f"></p>
<a class="btn" id="go" href="#">옵시디언에서 열기</a>
<p>자동으로 열리지 않으면 위 버튼을 누르세요. 이 페이지는 데이터를 저장하지 않고 링크를 옵시디언으로 넘기기만 합니다.</p>
</main>
<script>
(function(){
  var VAULT = "PROJECT_FREEDOM_MD";
  var file = ""; try { file = decodeURIComponent(location.hash.slice(1)); } catch(e) {}
  var t=document.getElementById("t"), f=document.getElementById("f"), go=document.getElementById("go");
  if (!file || file.length>400 || /[\x00-\x1f]/.test(file) || file.indexOf("..")>=0) { t.textContent="열 문서가 지정되지 않았습니다"; go.style.display="none"; return; }
  var uri="obsidian://open?vault="+encodeURIComponent(VAULT)+"&file="+encodeURIComponent(file);
  f.textContent=file.split("/").pop(); go.href=uri; location.href=uri;
})();
</script>
</body>
</html>
